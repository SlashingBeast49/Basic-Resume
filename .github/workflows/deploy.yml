name: Deploy thehsiddarth.com with Helix and Proof Subpages

on:
  push:
    branches: [main] # or master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout basic resume (Main Site)
        uses: actions/checkout@v4

      # --- 1. Setup Project Helix at /helix ---
      - name: Checkout Project Helix
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Project-Helix
          path: _temp_helix

      - name: Move Helix dashboard files to /helix
        run: |
          mkdir -p helix
          cp -r _temp_helix/dashboard/* helix/
          rm -rf _temp_helix

      # --- 2. Setup PROOF at /proof ---
      - name: Checkout PROOF
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PROOF
          path: _temp_proof

      - name: Move PROOF static files to /proof
        run: |
          mkdir -p proof
          cp -r _temp_proof/proof/static/* proof/
          rm -rf _temp_proof

      # --- 3. Deploy everything together ---
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4