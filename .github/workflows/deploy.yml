name: Deploy thehsiddarth.com with Social media shortcuts added

on:
  push:
    branches: [main] 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout basic resume (Main Site)
        uses: actions/checkout@v4
        
      - name: Checkout Project Helix
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Project-Helix
          path: _temp_helix

      - name: Move Helix dashboard files to /helix
        run: |
          mkdir -p helix
          cp -r _temp_helix/dashboard/* helix/
          rm -rf _temp_helix
      - name: Checkout CaReal
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CaReal
          path: careal
      - name: Checkout PROOF
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PROOF
          path: _temp_proof
      - name: Generate Social Redirects
        run: |
          create_redirect() {
            mkdir -p "$1"
            cat <<EOF > "$1/index.html"
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Redirecting...</title>
            <meta http-equiv="refresh" content="0; url=$2">
            <link rel="canonical" href="$2">
            <script>window.location.replace("$2");</script>
          </head>
          <body>
            <p>Redirecting to <a href="$2">$2</a>...</p>
          </body>
          </html>
          EOF
          }

          create_redirect "insta" "https://www.instagram.com/thehsiddarth"
          create_redirect "linkedin" "https://www.linkedin.com/in/thehsiddarth"
          create_redirect "github" "https://github.com/SlashingBeast49"
          create_redirect "xpe" "https://x.com/@thehsiddarth"
          create_redirect "xpr" "https://x.com/@thehsprojects"
          create_redirect "cav" "https://cavalloenterprises.in/"

      - name: Move PROOF static files to /proof
        run: |
          mkdir -p proof
          cp -r _temp_proof/proof/static/* proof/
          rm -rf _temp_proof

     
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
       
      
