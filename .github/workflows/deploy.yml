name: Deploy thehsiddarth.com with Helix Subpage

on:
  push:
    branches: [main] # Change to master if your default branch is master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout basic resume (Main Site)
        uses: actions/checkout@v4

      - name: Checkout Project Helix into /helix folder
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Project-Helix
          path: helix

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4