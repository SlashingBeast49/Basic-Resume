<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | H Siddarth</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #262626;
      --text: #f5f5f5;
      --muted: #888888;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 2.5rem;
      border-radius: 8px;
    }
    .code {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .path {
      color: var(--text);
      background: #1f1f1f;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      word-break: break-all;
    }
    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    a {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    a:hover {
      background: #1f1f1f;
      border-color: #444;
    }
    a.primary {
      grid-column: span 2;
      background: var(--accent);
      color: var(--bg);
      font-weight: 600;
      border-color: var(--accent);
    }
    a.primary:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">Error 404</div>
    <h1>Route not found.</h1>
    <p>The requested path <span class="path" id="bad-path"></span> does not exist on <strong>thehsiddarth.com</strong>.</p>
    <div class="links">
      <a href="/" class="primary">← Back to Home</a>
      <a href="/helix/">Project Helix</a>
      <a href="/proof/">Project PROOF</a>
      <a href="/github/">GitHub</a>
      <a href="/x/">X / Twitter</a>
    </div>
  </div>
  <script>
    document.getElementById('bad-path').textContent = window.location.pathname;
  </script>
</body>
</html>
